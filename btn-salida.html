<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Salida - Estacionamiento</title>
    
    <style>
        .entrada {
          
          height: 40px;
          line-height: 40px;
          border: none;
          border-radius: 5px;
          margin: auto;
          margin-top: 20px;
          margin-left: 7%;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
          text-align: left;
          padding-left: 30px;
          font-size: 16px;
          background-color: white;
          cursor: pointer;
      }
        .btn-emergencia {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            background-color: red;
            color: white;
            border: none;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease-in-out;
        }

        .btn-emergencia:hover {
            background-color: darkred;
            box-shadow: 0px 0px 15px rgba(255, 0, 0, 0.8);
            transform: scale(1.1);
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container ">
        <div class="card shadow-lg p-4">
            <h3 >Salida del Estacionamiento</h3>
            
            
                <label class="entrada">Selecciona el tipo de salida:</label>
                <select id="tipoSalida" class="form-select">
                    <option value="Parking">Parking</option>
                    <option value="Andenes">Andenes</option>
                </select>
           

            <div class="mb-3">
                <label class="form-label">Patente del vehículo:</label>
                <input type="text" id="patente" class="entrada" placeholder="Ej: ABCD-123">
            </div>

            <!-- Botón de Emergencia Redondo -->
            <div class="btn-container">
                <button id="btnSalida" class="btn-emergencia">SALIDA</button>
            </div>

            <div id="mensaje" class="mt-3 text-center"></div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $("#btnSalida").click(function() {
                let tipoSalida = $("#tipoSalida").val();
                let patente = $("#patente").val().trim();

                if (patente === "") {
                    $("#mensaje").html('<div class="alert alert-warning">Por favor, ingresa la patente.</div>');
                    return;
                }

                $.ajax({
                    url: "salida.php",
                    type: "POST",
                    data: { tipoSalida: tipoSalida, patente: patente.toUpperCase() },
                    dataType: "json",
                    success: function(response) {
                        if (response.success) {
                            $("#mensaje").html('<div class="alert alert-success">Salida autorizada para ' + patente + '.</div>');
                        } else {
                            $("#mensaje").html('<div class="alert alert-danger">Error: ' + response.message + '</div>');
                        }
                    },
                    error: function() {
                        $("#mensaje").html('<div class="alert alert-danger">No se pudo conectar con la API.</div>');
                    }
                });
            });
        });
    </script>

</body>
</html>
